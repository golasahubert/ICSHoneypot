version: '3.8'

services:

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scada_hmi
    networks:
      br_network:
         ipv4_address: 172.25.0.10

  scada_hmi:
    build:
      context: ./scada_hmi_docker
    container_name: scada_hmi_sswat
    restart: unless-stopped
    ports:
      - "8080:9090"
    networks:
      br_network:
        ipv4_address: 172.25.0.2

  plc1:
    build:
      context: ./plc_1_docker
    container_name: plc1_sswat
    restart: unless-stopped
    ports:
      - "127.0.0.1:2502:502"
      - "127.0.0.1:28080:8080"
    networks:
      br_network:
        ipv4_address: 172.25.0.3

  plc2:
    build:
      context: ./plc_2_docker
    container_name: plc2_sswat
    restart: unless-stopped
    ports:
      - "127.0.0.1:502:502"
      - "127.0.0.1:38080:8080"
    networks:
      br_network:
        ipv4_address: 172.25.0.4

  plc3:
    build:
      context: ./plc_3_docker
    container_name: plc3_sswat
    restart: unless-stopped
    ports:
      - "127.0.0.1:4502:502"
      - "127.0.0.1:48080:8080"
    networks:
      br_network:
        ipv4_address: 172.25.0.5

  simulator:
    build:
      context: ./physical_sim_docker
    container_name: sim_sswat
    restart: unless-stopped
    networks:
      br_network:
        ipv4_address: 172.25.0.6

networks:
  br_network:
    name: br_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
