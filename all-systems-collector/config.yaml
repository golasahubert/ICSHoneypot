# ============================================================================
# FINAL PLC DATA COLLECTOR - Configuration
# ============================================================================
#
# This configuration file controls:
# - how the collector runs (continuous or for X seconds)
# - poll interval
# - PLC addresses and ports
# - which fields to read from each PLC
# - where to save output files and logs
#
# NOTE:
#   - output.dir can be relative (./logs) or absolute (/var/lib/plc-collector)
#   - you can change it here without editing the Python code
# ============================================================================

runtime:
  mode: "duration"              # "continuous", "duration" or "24h"
  duration_seconds: 60        # 6h = 21600 seconds

polling:
  interval_ms: 1000             # read PLC every 1000 ms (1Hz)

output:
  dir: "./logs"                # wybór miejsca zapisu: ./logs albo np. /var/lib/plc-collector
  format: "jsonl"              # "jsonl" or "json"
  ack_url: ""                  # optional webhook URL

output_fields:
  include_timestamp: true
  include_duration: false
  include_data: true

plcs:
  - name: "PLC1 (T-201 Control)"
    host: "127.0.0.1"
    port: 2502
    unit_id: 1
    points:
      - name: "water_level"
        type: "input"
        address: 0
        count: 1
        datatype: "uint16"
        scale: 1.0
      - name: "pump_status"
        type: "coil"
        address: 0
        count: 1
        datatype: "uint16"
        scale: 1.0

  - name: "PLC2 (T-202 Monitor)"
    host: "127.0.0.1"
    port: 502
    unit_id: 1
    points:
      - name: "water_level"
        type: "input"
        address: 0
        count: 1
        datatype: "uint16"
        scale: 1.0

  - name: "PLC3 (T-203 Control)"
    host: "127.0.0.1"
    port: 4502
    unit_id: 1
    points:
      - name: "water_level"
        type: "input"
        address: 0
        count: 1
        datatype: "uint16"
        scale: 1.0
